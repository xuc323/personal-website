name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Optional: Customize the trigger phrase (default: @claude)
          # trigger_phrase: "/claude"

          # Optional: Trigger when specific user is assigned to an issue
          # assignee_trigger: "claude-bot"

          # Optional: Configure Claude's behavior with CLI arguments
          claude_args: |
            --max-turns 20
            --mcp-config '{"mcpServers":{"playwright":{"command":"npx","args":["@playwright/mcp@latest","--headless","--allowed-origins","*.workers.dev"]}}}'
            --allowedTools "Bash(npm install),Bash(npm ci),Bash(npm run build),Bash(npm run lint:*),mcp__playwright__browser_navigate,mcp__playwright__browser_snapshot,mcp__playwright__browser_take_screenshot,mcp__playwright__browser_console_messages,mcp__playwright__browser_evaluate,mcp__playwright__browser_close"
            --append-system-prompt "Validate rendering changes on the deployed preview, not locally. Cloudflare posts a preview deployment URL (under *.workers.dev) as a PR comment whenever a commit is pushed to an open PR; find that comment on the current PR rather than assuming a fixed URL, then drive it with the Playwright MCP tools (browser_navigate, browser_snapshot, browser_take_screenshot, browser_console_messages, browser_evaluate). Playwright reads the post-render DOM, so use it for markup questions as well as JS-dependent behavior: the dark-mode toggle, nav/carousel interactions, console errors. Fall back to a local check only when the preview is unavailable — no preview comment on the PR, or the URL fails to load, which usually means the deployment failed — in which case run npm run build and read the prerendered HTML at .next/server/app/<route>.html, and state clearly that you validated a local build rather than the deployment."

          # Optional: Advanced settings configuration
          # settings: |
          #   {
          #     "env": {
          #       "NODE_ENV": "test"
          #     }
          #   }
